[package]
name = "mem0-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Tauri 2 shell for the Rust mem0-desktop server (M4)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mem0-desktop-rs = { path = "../app" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
log = "0.4"
env_logger = "0.11"

[lib]
name = "mem0_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mem0-desktop"
path = "src/main.rs"
